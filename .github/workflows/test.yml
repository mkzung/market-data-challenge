name: tests + reproducibility

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Run analyze.py end-to-end
        run: |
          python analyze.py \
            --trades data/eth-btc-trades.csv \
            --orderbooks data/eth-btc-orderbooks.csv \
            --out figures \
            --findings findings.json

      - name: Run audit.py
        run: python audit.py

      - name: Reproducibility — findings.json byte-identical
        run: |
          cp findings.json findings.json.first
          python analyze.py \
            --trades data/eth-btc-trades.csv \
            --orderbooks data/eth-btc-orderbooks.csv \
            --out figures \
            --findings findings.json
          diff -q findings.json findings.json.first

      - name: Calibration — detectors don't fire on synthetic clean data
        run: python calibration.py

      - name: Upload generated figures
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/

      - name: Upload findings.json
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: findings
          path: findings.json
